{% extends "base_form.twig" %}

{% block main %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-xl-9">
            {% if erro %}
                <div class="alert alert-danger">{{ erro }}</div>
            {% endif %}

            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <div class="mb-4">
                        <h1 class="h4 mb-1">Nova base externa</h1>
                        <p class="text-body-secondary mb-0">Cadastre uma conexao MySQL/MariaDB com senha criptografada.</p>
                    </div>

                    <form action="{{ url('admin/bases-externas/store') }}" method="POST" class="row g-3 needs-validation" novalidate>
                        {{ form_token_input('external_source_create') }}

                        <div class="col-12 col-md-6">
                            <label for="nome" class="form-label fw-semibold">Nome da conexao</label>
                            <input type="text" class="form-control" id="nome" name="nome" maxlength="150" value="{{ dados.nome ?? '' }}" required>
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="host" class="form-label fw-semibold">Host</label>
                            <input type="text" class="form-control" id="host" name="host" maxlength="190" value="{{ dados.host ?? '' }}" required>
                        </div>

                        <div class="col-12 col-md-4">
                            <label for="porta" class="form-label fw-semibold">Porta</label>
                            <input type="number" class="form-control" id="porta" name="porta" min="1" max="65535" value="{{ dados.porta ?? 3306 }}" required>
                        </div>

                        <div class="col-12 col-md-4">
                            <label for="database_name" class="form-label fw-semibold">Banco</label>
                            <input type="text" class="form-control" id="database_name" name="database_name" maxlength="120" value="{{ dados.database_name ?? '' }}" required>
                        </div>

                        <div class="col-12 col-md-4">
                            <label for="charset" class="form-label fw-semibold">Charset</label>
                            <input type="text" class="form-control" id="charset" name="charset" maxlength="40" value="{{ dados.charset ?? 'utf8mb4' }}" required>
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="username" class="form-label fw-semibold">Usuario</label>
                            <input type="text" class="form-control" id="username" name="username" maxlength="120" value="{{ dados.username ?? '' }}" required>
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="password" class="form-label fw-semibold">Senha</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>

                        <div class="col-12 col-md-4">
                            <label for="ativo" class="form-label fw-semibold">Status</label>
                            <select class="form-select" id="ativo" name="ativo" required>
                                <option value="1" {{ (dados.ativo ?? 1) == 1 ? 'selected' : '' }}>Ativo</option>
                                <option value="0" {{ (dados.ativo ?? 1) == 0 ? 'selected' : '' }}>Inativo</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label for="descricao" class="form-label fw-semibold">Descricao</label>
                            <textarea class="form-control" id="descricao" name="descricao" rows="4">{{ dados.descricao ?? '' }}</textarea>
                        </div>

                        <hr class="my-4">

                        <div class="col-12 d-flex flex-column flex-sm-row justify-content-end gap-2">
                            <a href="{{ url('admin/bases-externas') }}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Salvar conexao</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock main %}
